<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review</title>

    <meta name="description" content="Product Review by Liezl G. Lizardo. A review of a product with detailed analysis and user experience.">
    <meta name="author" content="Liezl G. Lizardo">

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>

<header>
    <h1>Product Review</h1>
</header>

<main>

<form method="get" action="review.html">

    <!-- Product Name -->
    <label for="product">Product Name</label>

    <select id="product" name="product" required>
        <option value="" disabled selected>Select a Product ...</option>
    </select>

    <!-- Overall Rating -->
    <fieldset>

        <legend>Overall Rating</legend>

        <input type="radio" id="rating1" name="rating" value="1" required>
        <label for="rating1">☆</label>
        <br>

        <input type="radio" id="rating2" name="rating" value="2" required>
        <label for="rating2">☆☆</label>
        <br>

        <input type="radio" id="rating3" name="rating" value="3" required>
        <label for="rating3">☆☆☆</label>
        <br>

        <input type="radio" id="rating4" name="rating" value="4" required>
        <label for="rating4">☆☆☆☆</label>
        <br>

        <input type="radio" id="rating5" name="rating" value="5" required>
        <label for="rating5">☆☆☆☆☆</label>

    </fieldset>

    <!-- Date of Installation -->
    <label for="installDate">Date of Installation</label>

    <input
        type="date"
        id="installDate"
        name="installDate"
        required>

    <!-- Useful Features -->
    <fieldset>

        <legend>Which features did you find useful in the product?</legend>

        <p class="optional">(Check all that apply)</p>

        <input
            type="checkbox"
            id="durability"
            name="durability"
            value="Durability">

        <label for="durability">Durability</label>

        <br>

        <input
            type="checkbox"
            id="easeofuse"
            name="easeofuse"
            value="Ease of Use">

        <label for="easeofuse">Ease of Use</label>

        <br>

        <input
            type="checkbox"
            id="performance"
            name="performance"
            value="Performance">

        <label for="performance">Performance</label>

        <br>

        <input
            type="checkbox"
            id="design"
            name="design"
            value="Design">

        <label for="design">Design</label>

    </fieldset>

    <!-- Written Review -->
    <label for="review">
        Written Review
        <span class="optional">(Optional)</span>
    </label>

    <textarea
        id="review"
        name="review"
        rows="5"></textarea>

    <!-- User Name -->
    <label for="username">
        Your Name
        <span class="optional">(Optional)</span>
    </label>

    <input
        type="text"
        id="username"
        name="username">

    <!-- Submit Button -->
    <input
        type="submit"
        value="Post Review">

</form>

</main>

<footer>
    <p>
        &copy; <span id="year"></span>
        Liezl G. Lizardo
    </p>

    <p id="lastModified"></p>
</footer>

</body>
</html>

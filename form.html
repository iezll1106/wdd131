<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review</title>

    <meta name="description" content="Product Review by Liezl G. Lizardo. A review of a product with detailed analysis and user experience.">
    <meta name="author" content="Liezl G. Lizardo">

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
<header>
    <h1>Product Review</h1>
</header>

<main>

<form method="get" action="review.html">

    <!-- Product Name -->
    <label for="product">Product Name</label>

    <select id="product" name="product" required>

        <option value="" disabled selected>
            Select a Product ...
        </option>

    </select>

    <!-- Rating -->
    <fieldset>
        <legend>Overall Rating</legend>

        <div class="rating-group">
            <label><input type="radio" name="rating" value="1" required> ☆</label>
            <label><input type="radio" name="rating" value="2"> ☆☆</label>
            <label><input type="radio" name="rating" value="3"> ☆☆☆</label>
            <label><input type="radio" name="rating" value="4"> ☆☆☆☆</label>
            <label><input type="radio" name="rating" value="5"> ☆☆☆☆☆</label>
        </div>
    </fieldset>

    <fieldset>
        <legend>Which features did you find useful in the product?</legend>

        <div class="features">
            <label><input type="checkbox" value="Durability"> Durability</label>
            <label><input type="checkbox" value="Ease of Use"> Ease of Use</label>
            <label><input type="checkbox" value="Performance"> Performance</label>
            <label><input type="checkbox" value="Design"> Design</label>
        </div>
    </fieldset>
    <!-- Written Review -->
    <label for="review">Written Review (Optional)</label>
    <textarea id="review" name="review"></textarea>

    <label for="username">Your Name (Optional)</label>
    <input type="text" id="username" name="username">
    <input type="submit" value="Post Review">

</main>

<footer>
    <p>&copy; <span id="year"></span> Liezl G. Lizardo</p>
    <p id="lastModified"></p>
</footer>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 | Beautiful Philippines | Liezl G. Lizardo</title>

    <meta name="description" content="Discover the beauty of the Philippines. Explore data, weather, and stunning views of this tropical paradise.">
    <meta name="author" content="Liezl G. Lizardo">
    
    <link rel="stylesheet" href="styles/place.css">
    <script src="scripts/place.js" defer></script>
</head>

<body>

    <header>
        <h1>Philippines</h1>
    </header>

    <main>

        <picture>
            <source srcset="images/hero-large.webp" media="(min-width: 768px)">
            <img src="images/hero-small.webp" alt="Beautiful view of the Philippines">
        </picture>

        <section class="data">
            <h2>Data</h2>

            <p><strong>Area:</strong> 300,000 sq km</p>
            <p><strong>Population:</strong> 114 million</p>
            <p><strong>Capital:</strong> Manila</p>
            <p><strong>Languages:</strong> Filipino, English</p>
            <p><strong>Currency:</strong> Philippine Peso</p>
            <p><strong>Time Zone:</strong> UTC+8</p>
        </section>

        <section class="weather">
            <h2>Weather</h2>

            <img src="images/weather.svg" alt="Weather icon" class="weather-icon">

            <p><strong>Temperature:</strong> <span id="temp">28</span>°C</p>
            <p><strong>Wind Speed:</strong> <span id="wind">10</span> km/h</p>
            <p><strong>Conditions:</strong> Sunny</p>
            <p><strong>Wind Chill:</strong> <span id="windchill"></span></p>
        </section>

    </main>

    <footer>
        <p>&copy; <span id="year"></span> 🌴 Philippines 🌴</p>
        <p>Last Modified: <span id="lastModified"></span></p>

    </footer>

</body>
</html>

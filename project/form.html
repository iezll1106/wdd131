<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Review</title>

    <meta name="description" content="Website Review by Liezl G. Lizardo. Share your feedback and experience about a website.">
    <meta name="author" content="Liezl G. Lizardo">

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>

<header>
    <h1>Website Review</h1>
</header>

<main>

    <form method="get" action="review.html">

        <!-- Overall Rating -->
        <fieldset>

            <legend>Overall Rating *</legend>

            <input type="radio" id="rating1" name="rating" value="1" required>
            <label for="rating1">☆</label>
            <br>

            <input type="radio" id="rating2" name="rating" value="2" required>
            <label for="rating2">☆☆</label>
            <br>

            <input type="radio" id="rating3" name="rating" value="3" required>
            <label for="rating3">☆☆☆</label>
            <br>

            <input type="radio" id="rating4" name="rating" value="4" required>
            <label for="rating4">☆☆☆☆</label>
            <br>

            <input type="radio" id="rating5" name="rating" value="5" required>
            <label for="rating5">☆☆☆☆☆</label>

        </fieldset>

        <!-- Useful Features -->
        <fieldset>

            <legend>
                Which features did you find useful on this website?
            </legend>

            <p class="optional">
                (Check all that apply)
            </p>

            <div class="features">

                <div>
                    <input
                        type="checkbox"
                        id="easy-navigation"
                        name="easy-navigation"
                        value="Easy Navigation">

                    <label for="easy-navigation">
                        Easy Navigation
                    </label>
                </div>

                <div>
                    <input
                        type="checkbox"
                        id="responsive-design"
                        name="responsive-design"
                        value="Responsive Design">

                    <label for="responsive-design">
                        Responsive Design
                    </label>
                </div>

                <div>
                    <input
                        type="checkbox"
                        id="visual-design"
                        name="visual-design"
                        value="Visual Design">

                    <label for="visual-design">
                        Visual Design
                    </label>
                </div>

                <div>
                    <input
                        type="checkbox"
                        id="useful-content"
                        name="useful-content"
                        value="Useful Content">

                    <label for="useful-content">
                        Useful Content
                    </label>
                </div>

                <div>
                    <input
                        type="checkbox"
                        id="fast-loading"
                        name="fast-loading"
                        value="Fast Loading">

                    <label for="fast-loading">
                        Fast Loading
                    </label>
                </div>

            </div>

        </fieldset>

        <!-- Visit Date -->
        <label for="visitdate">
            Date Visited *
        </label>

        <input
            type="date"
            id="visitdate"
            name="visitdate"
            required>

        <!-- Written Review -->
        <label for="review">
            Written Review
            <span class="optional">(Optional)</span>
        </label>

        <textarea
            id="review"
            name="review"
            rows="5"
            placeholder="Share your experience with this website..."></textarea>

        <!-- Reviewer Name -->
        <label for="username">
            Your Name
            <span class="optional">(Optional)</span>
        </label>

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter your name">

        <!-- Submit -->
        <input
            type="submit"
            value="Submit Review">

    </form>

    <!-- Contact Information -->
    <section class="contact-card">

        <h2>Contact Information</h2>

        <p>
            <strong>Email:</strong>
            guimarastourism@gmail.com
        </p>

        <p>
            <strong>Phone:</strong>
            +63 9384234940
        </p>

        <p>
            <strong>Location:</strong>
            Guimaras, Philippines
        </p>

    </section>

</main>

<footer>
    <p>
        &copy; <span id="year"></span>
        Liezl G. Lizardo
    </p>

    <p id="lastModified"></p>
</footer>

</body>
</html>
